name: Release (Windows)

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  windows-bundle-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri (bundles)
        run: npm run tauri build

      - name: Show bundle output (debug)
        shell: pwsh
        run: |
          Write-Host "== Bundle directory =="
          if (Test-Path "src-tauri/target/release/bundle") {
            Get-ChildItem -Recurse "src-tauri/target/release/bundle" | Select-Object FullName
          } else {
            Write-Host "Bundle folder not found"
          }

      - name: Create GitHub Release and upload installers
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/msi/**/*.msi
            src-tauri/target/release/bundle/nsis/**/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}